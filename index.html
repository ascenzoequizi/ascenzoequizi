<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nim-Gir</title>
<meta name="description" content="Nim-Gir: a crest-dice card duel. Play the AI, solve puzzles, or duel a friend online with an invite link.">
<meta name="theme-color" content="#1B1820">
<meta property="og:title" content="Nim-Gir: a crest-dice card duel">
<meta property="og:description" content="Tap the link to join the duel. No account needed.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E7E3EC; --felt:#F4F2F7; --panel:#FFFFFF; --panel2:#F0EDF4; --text:#1B1820; --muted:#5C5666; --line:#CDC6D6;
  --rise:#93650A; --arcane:#5E41BC; --strike:#B3302A; --wild:#555A68; --heart:#BC2F4B;
  --hunter:#2B78AD; --arcanist:#1C8579; --dragonkin:#AD5918; --demon:#A1304F; --oathbound:#8C6D12;
  --focus:#5E41BC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121015; --felt:#18151D; --panel:#221E28; --panel2:#2A2531; --text:#EDEAF2; --muted:#A8A3B3; --line:#3A3542;
    --rise:#E8B64C; --arcane:#A98BF0; --strike:#EF6A5E; --wild:#DCE0E8; --heart:#FF6B85;
    --hunter:#4FA3D9; --arcanist:#3FBFAE; --dragonkin:#E0833A; --demon:#D9587C; --oathbound:#E3BE55; --focus:#A98BF0;
  }
}
:root[data-theme="dark"]{
  --bg:#121015; --felt:#18151D; --panel:#221E28; --panel2:#2A2531; --text:#EDEAF2; --muted:#A8A3B3; --line:#3A3542;
  --rise:#E8B64C; --arcane:#A98BF0; --strike:#EF6A5E; --wild:#DCE0E8; --heart:#FF6B85;
  --hunter:#4FA3D9; --arcanist:#3FBFAE; --dragonkin:#E0833A; --demon:#D9587C; --oathbound:#E3BE55; --focus:#A98BF0;
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.display{font-family:Cinzel,Georgia,serif;font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.ic{display:inline-block;vertical-align:-3px}
.c-R{color:var(--rise)} .c-A{color:var(--arcane)} .c-S{color:var(--strike)} .c-W{color:var(--wild)} .c-H{color:var(--heart)}

/* setup */
.setup{max-width:880px;margin:40px auto;padding:0 16px}
.setup h1{font-size:44px;margin:0 0 6px}
.setup p.lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.pickcol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.pickcol h2{font-size:22px;margin:0 0 12px}
.clsbtn{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:10px;border:2px solid var(--line);background:var(--panel2)}
.clsbtn b{display:block;font-family:Cinzel,Georgia,serif;font-size:18px;color:var(--c)}
.clsbtn span{font-size:14px;color:var(--muted)}
.clsbtn[aria-pressed="true"]{border-color:var(--c);background:var(--panel)}
.primary{padding:12px 22px;border-radius:10px;border:0;background:var(--text);color:var(--bg);font-weight:700;font-size:16px}
.ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:15px}

/* game */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:22px;margin:0;flex-grow:1}
.phase{font-weight:600;color:var(--muted)}
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:980px){.game{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--felt);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.strip .who{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:18px;color:var(--c)}
.strip .cls{color:var(--muted);font-size:14px}
.strip .stat{display:flex;align-items:center;gap:5px;font-weight:600}
.grow{flex-grow:1}
.hearts{display:flex;gap:2px;color:var(--heart)}
.dial{display:flex;gap:6px}
.dial span{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--panel2);font-weight:700}
.rowlabel{font-size:13px;color:var(--muted);margin:0 2px -4px}
.lanes,.backrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{min-height:150px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;padding:0}
.backrow .slot{min-height:64px}
.unit .nm{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:15px;line-height:1.15}
.unit .lv{font-size:13px;font-weight:600;color:var(--c)}
.unit .nums{display:flex;gap:12px;font-size:20px;font-weight:700;margin-top:2px}
.unit .nums small{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.unit .hurt{color:var(--strike)}
.unit .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.tag.on{background:var(--c);color:var(--panel)}
.backcard{width:100%;min-height:64px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;padding:6px}
.backcard.down{background:repeating-linear-gradient(45deg,var(--panel2) 0 8px,var(--panel) 8px 16px);color:var(--muted)}
.backcard.up{border-color:var(--c);background:var(--panel)}
.centre{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.centre .msg{flex-grow:1;color:var(--muted);font-size:15px;min-width:200px}
.dice{display:flex;gap:8px}
.die{width:58px;height:58px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;gap:1px}
.die[aria-pressed="true"]{border-color:var(--strike);box-shadow:0 0 0 2px var(--strike) inset}
.hand{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.hcard{flex:0 0 168px;min-height:190px;text-align:left;border:3px solid var(--c);border-radius:12px;background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.hcard .cost{display:flex;gap:2px;align-items:center;min-height:20px}
.hcard .nm{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:15px;line-height:1.15}
.hcard .ty{font-size:13px;color:var(--muted);font-weight:600}
.hcard .tx{font-size:13px;line-height:1.3}
.hcard .st{font-weight:700;font-size:15px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:12px}
@media (max-width:980px){.log{position:static;max-height:320px}}
.log h2{font-size:18px;margin:0 0 8px}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.log li{padding-bottom:6px;border-bottom:1px solid var(--line)}
.log li span{color:var(--muted);font-size:12px;margin-right:6px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--panel);color:var(--text);border-radius:16px;border:1px solid var(--line);width:min(520px,100%);max-height:85vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 6px;font-size:22px}
.modal .who{font-size:14px;font-weight:700;color:var(--heart);margin-bottom:6px}
.modal .body{color:var(--text);font-size:15px;margin-bottom:14px}
.modal .body p{margin:0 0 6px}
.modal .opts{display:flex;flex-direction:column;gap:8px}
.modal .opts button{text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.modal .opts button.cancel{background:transparent;color:var(--muted)}
.banner{padding:14px 16px;border-radius:12px;background:var(--panel);border:2px solid var(--heart);font-weight:700;font-size:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lvtable{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.lvtable td,.lvtable th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

.slot.filled{border:0;align-items:stretch}
.unit{width:100%;min-height:150px;text-align:left;border:3px solid var(--c);border-radius:12px;background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.unit.selected,.hcard.selected{box-shadow:0 0 0 3px var(--text)}
.uname{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;border-radius:6px}
.uname:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.act{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px;font-weight:700}
.act.strong{background:var(--c);border-color:var(--c);color:var(--panel)}
.act.big{flex-grow:1;justify-content:center;background:var(--text);color:var(--bg);border-color:var(--text)}
.drop{width:100%;height:100%;min-height:inherit;border:0;border-radius:10px;background:var(--panel);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 0 2px var(--text) inset}
.drop small{font-weight:500;color:var(--muted)}
.hcard.dim{opacity:.5}
.rules{margin-top:20px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:4px}
.seg button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.diecol{display:flex;flex-direction:column;align-items:center;gap:4px}
.wildpick{display:flex;gap:3px}
.wildpick button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}
.wildpick button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--text) inset;background:var(--panel)}
.clsrow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.clsrow .clsbtn{margin-bottom:0;flex-grow:1}
.viewbtn{flex-shrink:0;white-space:nowrap}
.modal.wide{width:min(1000px,100%)}
.deckh{font-size:18px;margin:16px 0 8px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.deckcard{border:3px solid var(--c);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.deckcard .dtop{display:flex;justify-content:space-between;align-items:center}
.deckcard .cnt{font-weight:700;color:var(--muted)}
.deckcard .nm{font-size:17px;margin:2px 0 4px}
.deckcard .dinfo{font-size:14px}
.deckcard .dinfo p{margin:0 0 4px}
@media (max-width:640px){
  .unit .nums{font-size:16px;gap:8px}
  .slot,.unit{min-height:132px}
  .unit .nm{font-size:13px}
}

/* ===== visual pass ===== */
.board{background-color:var(--felt);background-image:radial-gradient(color-mix(in srgb,var(--text) 7%,transparent) 1px,transparent 1px);background-size:18px 18px}
.slot{min-height:236px;position:relative}
.backrow .slot{min-height:58px}
.slotlabel{font-size:13px;color:var(--muted)}
.unit{position:relative;min-height:236px;border:4px solid var(--c);border-radius:14px;background:var(--panel);padding:8px;gap:5px;overflow:visible}
.unit.awake{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.unit.targetable{outline:3px dashed var(--text);outline-offset:3px}
.uhead{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;border-radius:6px;min-height:30px}
.uhead:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lvb{flex-shrink:0;min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--c);color:var(--panel);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.uhead .nm{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:14px;line-height:1.15}
.uart{height:62px;border-radius:9px;background:color-mix(in srgb,var(--c) 16%,var(--panel2));color:var(--c);display:flex;align-items:center;justify-content:center}
.ustats{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
.ustats span{display:flex;align-items:center;gap:4px}
.ustats .hp{color:var(--text)}
.ustats .hp small{font-size:12px;color:var(--muted);font-weight:600}
.ustats .hp.hurt{color:var(--strike)}
.ustats .hp svg{color:var(--heart)}
.hpbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--c);transition:width .4s ease}
.tag.frost{background:color-mix(in srgb,var(--arcanist) 25%,var(--panel2));color:var(--text)}
.ghostcard{position:absolute;inset:0;border-radius:12px;border:3px solid var(--c);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Cinzel,Georgia,serif;pointer-events:none;animation:ghostOut 1.1s ease forwards}
.ghostcard b{color:var(--strike)}
.float{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:24px;pointer-events:none;z-index:2;text-shadow:0 1px 0 var(--panel),0 0 6px var(--panel);opacity:0;animation:floatUp 1.2s ease forwards}
.f-hit{color:var(--strike)} .f-heal{color:var(--arcanist)} .f-level{color:var(--rise);font-size:28px}
.fx-hit{animation:hitShake .45s ease}
.fx-summon{animation:summonIn .45s ease}
.fx-level{animation:levelGlow .9s ease}
.fx-attack.side-me{animation:lungeUp .45s ease}
.fx-attack.side-op{animation:lungeDown .45s ease}
.fx-attack.fx-hit.side-me{animation:lungeUp .45s ease,hitShake .45s ease .45s}
.backcard{min-height:54px;gap:8px;font-size:13px}
.backcard.down{background:var(--panel2);border:2px solid var(--rise);color:var(--rise);background-image:none}
.backcard.down span{color:var(--text)}
.backcard.up{color:var(--c)}
.backcard.up span{color:var(--text)}
.strip{gap:12px}
.strip.active{box-shadow:0 0 0 2px var(--c)}
.strip .crest{color:var(--c);display:flex}
.whoblock{display:flex;flex-direction:column;line-height:1.1}
.hrt{display:inline-flex;color:var(--heart)}
.hrt.empty{color:var(--line)}
.hrt.breaking{color:var(--heart);animation:heartBreak .9s ease forwards}
.dial .pip{padding:4px 10px;gap:5px}
.dial .pip b{font-size:16px}
.hcard{flex:0 0 160px;min-height:228px;border-width:4px;gap:5px;position:relative}
.hcard .hart{height:46px;border-radius:8px;background:color-mix(in srgb,var(--c) 16%,var(--panel2));color:var(--c);display:flex;align-items:center;justify-content:center}
.hcard .hstats{display:flex;gap:12px;font-weight:700;font-size:15px}
.hcard .hstats span{display:flex;align-items:center;gap:3px}
.hcard .hstats svg:last-child{color:var(--heart)}
.hcard.t-counter{background:color-mix(in srgb,var(--arcane) 7%,var(--panel))}
.hcard:not(.dim):hover{transform:translateY(-4px);transition:transform .15s ease}
.hcard.selected{transform:translateY(-8px)}
.die{width:62px;height:62px}
.die.face-R{color:var(--rise)} .die.face-A{color:var(--arcane)} .die.face-S{color:var(--strike)} .die.face-W{color:var(--wild)}
.die.tumble svg{animation:tumble .55s cubic-bezier(.3,.7,.4,1)}
.banner{border-color:var(--c);padding:16px 18px}
.banner .bem{color:var(--c);display:flex}
.btitle{display:block;font-family:Cinzel,Georgia,serif;font-size:26px;color:var(--c)}
.bsub{display:block;font-size:15px;color:var(--muted);font-weight:500}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-44px)}}
@keyframes hitShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes summonIn{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
@keyframes levelGlow{0%{box-shadow:0 0 0 0 var(--rise)}40%{box-shadow:0 0 0 10px color-mix(in srgb,var(--rise) 35%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes lungeUp{0%,100%{transform:none}40%{transform:translateY(-16px) scale(1.04)}}
@keyframes lungeDown{0%,100%{transform:none}40%{transform:translateY(16px) scale(1.04)}}
@keyframes ghostOut{0%{opacity:1;transform:none}100%{opacity:0;transform:scale(.88) rotate(-4deg)}}
@keyframes heartBreak{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(.8);color:var(--line)}}
@keyframes tumble{0%{transform:rotate(-200deg) scale(.6)}100%{transform:none}}
@media (max-width:640px){.slot,.unit{min-height:210px}.uart{height:44px}.ustats{font-size:15px}.hcard{flex-basis:140px;min-height:210px}}

/* ===== screens ===== */
.screen{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
.screentop{min-height:40px}
.screenh{font-size:36px;margin:8px 0 18px}
.muted{color:var(--muted)} .small{font-size:13px}
.big{font-size:17px;padding:14px 26px;min-width:220px}
.linkbtn{all:unset;cursor:pointer;color:var(--text);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.linkbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.title{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 16px;text-align:center}
.ranks{display:flex;gap:clamp(6px,2vw,18px);font-family:Cinzel,Georgia,serif;font-weight:700;font-size:clamp(22px,5vw,40px)}
.rk{width:1.6em;height:1.6em;border-radius:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);color:var(--muted);opacity:0;animation:rkIn .5s ease forwards}
.rk-s{border-color:var(--rise);color:var(--rise);animation:rkIn .5s ease forwards,rkGlow 1.6s ease .9s}
.logo{font-size:clamp(56px,13vw,132px);line-height:.95;margin:6px 0 0;letter-spacing:.02em;opacity:0;animation:logoIn .7s cubic-bezier(.2,.8,.2,1) .75s forwards}
.tagline{margin:0;color:var(--muted);font-size:18px;max-width:40ch}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:14px;align-items:center}
.tpaths{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.tpath{display:flex;align-items:center;gap:8px;color:var(--c);font-size:14px}
.tpath b{color:var(--text);font-weight:600}
.ver{font-size:13px;color:var(--muted);margin:6px 0 0}
.pickgrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.pickgrid{grid-template-columns:minmax(0,1fr)}.vsmark{text-align:center}}
.pickside h2{font-size:22px;margin:0 0 10px}
.posters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

@keyframes rkIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rkGlow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rise) 30%,transparent)}}

/* ===== v14: art, card faces, phases, dice, AI, options ===== */
.uart{background:none}
.uart svg.art,.gamewrap .uart svg.art{width:100%;height:100%;max-height:none;display:block;border-radius:7px}
.hcard .hart{background:none;overflow:hidden}
.hcard .hart svg.art,.gamewrap .hcard .hart svg.art{width:100%;height:100%;max-height:none;display:block}
.cf{--w:210px;width:var(--w);font-size:calc(var(--w) / 16);border:.32em solid var(--c);border-radius:.8em;background:var(--panel);color:var(--text);display:flex;flex-direction:column;gap:.35em;padding:.45em;text-align:left;flex-shrink:0;line-height:1.25}
.cf-s{--w:158px} .cf-m{--w:214px} .cf-l{--w:280px}
.cf-top{display:flex;align-items:center;gap:.4em;min-height:1.6em}
.cf-cost{display:flex;gap:.1em;flex-shrink:0;align-items:center} .cf-cost svg{width:1.05em;height:1.05em}
.cf-name{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:1.02em;line-height:1.1}
.cf-art{aspect-ratio:3/2;border-radius:.5em;overflow:hidden} .cf-art svg{width:100%;height:100%;display:block}
.cf-type{display:flex;justify-content:space-between;align-items:center;gap:.3em;font-size:.74em;font-weight:700;color:var(--muted);flex-wrap:wrap}

.cf-body{font-size:.76em;flex:1}
.cf-text{margin:0 0 .35em}
.cf-lv{display:grid;grid-template-columns:4.2em 3em 3em 1fr;column-gap:.3em;align-items:baseline;padding:.12em .3em;border-radius:.3em}
.cf-lv.hd{font-size:.85em;color:var(--muted);font-weight:700;padding-bottom:0}
.cf-lv b{color:var(--c);font-family:Cinzel,Georgia,serif;white-space:nowrap}
.cf-lv span{font-weight:700}
.cf-lv em{grid-column:1/-1;font-style:normal;color:var(--muted);font-size:.94em}
.cf-lv.cur{background:color-mix(in srgb,var(--c) 20%,transparent);outline:1px solid var(--c)}
.cf-lv.top b::after{content:' ★'}
.cf-foot{display:flex;justify-content:space-between;font-size:.62em;color:var(--muted);font-weight:600}
.detail{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dside{flex:1;min-width:190px}
.dside p{margin:0 0 8px}
.kwhelp p{font-size:14px;color:var(--muted)}
.now{font-size:15px}
.warn{padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--strike) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--strike) 45%,transparent)}
.modal.wide{width:min(780px,100%)}
.choices{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:8px}
.choice{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;border-radius:12px;padding:4px;flex-shrink:0}
.choice:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.choice:hover .cf,.choice:focus-visible .cf{transform:translateY(-3px);transition:transform .15s ease}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.clabel{font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;background:var(--text);color:var(--bg)}
.minigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:8px}
.mini{border:2px solid var(--c);border-radius:8px;overflow:hidden;font-size:11px;font-weight:700;background:var(--panel2)}
.mini-art{aspect-ratio:3/2} .mini-art svg{width:100%;height:100%;display:block}
.mini span{display:block;padding:3px 5px;line-height:1.2}
.gallery{display:flex;flex-wrap:wrap;gap:12px}
.steps{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.steps span{padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.steps span.done{opacity:.55}
.steps i{font-style:normal;opacity:.6}
.centre.battle{border-color:var(--strike);box-shadow:0 0 0 1px var(--strike) inset}
.battlebtn{display:inline-flex;align-items:center;gap:6px;background:var(--strike)!important;color:#fff!important}
.centre.roll{align-items:center}
.rollinfo{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.rollbtns{display:flex;gap:8px;flex-wrap:wrap}
.preview{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:700;font-size:14px}
.plabel{font-size:13px;color:var(--muted);font-weight:600}
.gain{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;background:var(--panel2)}
.gain small{font-weight:600;color:var(--muted);margin-left:2px}
.gain.q{outline:1px dashed var(--muted)}
.die{position:relative}
.die.marked{border:2px dashed var(--strike);opacity:.7}
.die.marked::after{content:'↻';position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--strike);color:#fff;font-size:13px;line-height:20px;text-align:center}
.keep{font-size:11px;font-weight:700;color:var(--muted)} .keep.re{color:var(--strike)}
.pip{position:relative}
.pip.gainfx{animation:pipPulse .9s ease}
.pf{position:absolute;left:50%;top:-6px;font-weight:800;font-size:14px;pointer-events:none;opacity:0;animation:floatUp 1.2s ease forwards}
@keyframes pipPulse{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
.handrow{position:relative}
.handlock{position:absolute;left:0;right:0;bottom:0;top:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:12px;background:color-mix(in srgb,var(--bg) 72%,transparent);font-weight:700;z-index:2;pointer-events:none}

.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}

.optwrap{position:relative}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.modecard span{color:var(--muted)}

.modecard:disabled{opacity:.6}
.modecard .soon{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--panel2);color:var(--text)}

.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--rise),#c79a1b);border-radius:99px}
.rankres{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.rankres>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rankres.up{border-color:#c79a1b;box-shadow:0 0 0 2px color-mix(in srgb,#c79a1b 40%,transparent);animation:bannerIn .6s ease both}
.profhead{display:flex;gap:18px;align-items:center}
.profinfo{flex:1;min-width:0}
.profinfo input{display:block;width:100%;box-sizing:border-box;margin:6px 0 4px;font:600 18px/1.2 var(--sans,system-ui);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.ladder{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 0 10px}
.ladder>i{flex:1;min-width:8px;height:2px;background:var(--line)}
.lstep{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.5}
.lstep.done,.lstep.on{opacity:1}
.lstep.on .rkb{transform:scale(1.15);box-shadow:0 0 0 3px color-mix(in srgb,var(--rkc) 30%,transparent)}
.lstep small{font-size:11px;color:var(--muted)}
.pcls{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--c)}
.pcls span:not(.muted){color:var(--text)}
.pgames{list-style:none;margin:0;padding:0}
.pg{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.pres{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:var(--muted)}
.pg.win .pres{background:#3f8f5a}.pg.loss .pres{background:var(--strike)}
.pdp{font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:640px){.profhead{flex-direction:column;align-items:stretch;text-align:left}.rkb.rb-xl{align-self:center}}

/* ---------- puzzles ---------- */
.pzcard{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;position:relative}
.pzcard>svg{color:var(--c);flex:none}
.pzcard:hover{border-color:var(--c)}
.pzcard.today{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent);margin-bottom:16px;padding:18px}
.pzcard.today b{font-size:22px}
.pzt{display:flex;flex-direction:column;gap:3px;min-width:0}
.pzt small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.pzt b{font-family:Cinzel,Georgia,serif;font-size:18px}
.pzt span{color:var(--muted);font-size:14px}
.pztick{position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:50%;background:#3f8f5a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.pzcard.solved{opacity:.85}
.pzlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:700px){.pzlist{grid-template-columns:minmax(0,1fr)}}

/* ---------- tutorial coach ---------- */
.coach{position:fixed;left:0;right:0;margin:0 auto;top:52px;z-index:11;width:min(560px,calc(100vw - 20px));box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--panel);color:var(--text);border:2px solid var(--hunter);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.coach.fresh{animation:coachIn .35s ease both}
@keyframes coachIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.coachav{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--hunter) 15%,transparent);color:var(--hunter)}
.coachtx{flex:1;min-width:0}
.coachtx p{margin:0;font-size:15px;line-height:1.45}
.coachbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.coachbtns .primary{padding:8px 18px;font-size:15px}
.coachn{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.coachhl{position:relative;z-index:4;animation:coachPulse 1.3s ease-in-out infinite!important;box-shadow:0 0 0 3px #f5c84c,0 0 22px 4px rgba(245,200,76,.7)!important;border-radius:10px}
@keyframes coachPulse{0%,100%{box-shadow:0 0 0 3px #f5c84c,0 0 12px 2px rgba(245,200,76,.5)}50%{box-shadow:0 0 0 5px #f5c84c,0 0 26px 8px rgba(245,200,76,.8)}}
@media (max-width:640px){.coach{top:40px;padding:10px 12px}.coachtx p{font-size:14px}}
.tutcard{border-color:var(--hunter)}
.tutnudge{border-color:var(--hunter);color:var(--hunter)}
@media (prefers-reduced-motion: reduce){.coachhl{animation:none!important}}
</style>

 hunter:{name:'Awakened Hunter',blurb:'Cheap Summons that level up by fighting (Hunt).'},

function p2pAdapter(){
 const store={},subs={};let peer=null,conn=null,isHost=false,syncWait=null,joinCode=null,retry=0;

 const fire=function(path){(subs[path]||[]).slice().forEach(function(cb){try{cb(cp(store[path]));}catch(e){console.error(e);}});};

   if(!m||typeof m!=='object') return;
   if(m.t==='set'&&typeof m.path==='string'){store[m.path]=m.obj;fire(m.path);}
   if(m.t==='sync'&&m.store&&!isHost){Object.keys(m.store).forEach(function(k){store[k]=m.store[k];fire(k);});if(syncWait){const w=syncWait;syncWait=null;w();}}
  });

  return new Promise(function(res,rej){
   if(peer){try{peer.destroy();}catch(e){}}
   isHost=true;conn=null;Object.keys(store).forEach(function(k){delete store[k];});
   let opened=false;
   peer=new window.Peer('nimgir-'+code.toLowerCase(),{debug:0,config:ICE});
   peer.on('open',function(){opened=true;res();});
   peer.on('connection',function(c){wire(c);});
   peer.on('disconnected',function(){try{peer.reconnect();}catch(e){}});
   peer.on('error',function(e){console.error(e);if(!opened) rej(e);});
  });
 };
 A.join=function(code){
  return new Promise(function(res,rej){
   if(peer){try{peer.destroy();}catch(e){}}
   isHost=false;conn=null;joinCode=code.toLowerCase();retry=0;
   let done=false;const fail=function(e){if(!done){done=true;rej(e);}};
   peer=new window.Peer({debug:0,config:ICE});
   peer.on('open',function(){syncWait=function(){done=true;res();};wire(peer.connect('nimgir-'+joinCode,{reliable:true}));});
   peer.on('error',function(e){console.error(e);fail(e);});

  });

}

const MUS={gain:null,next:0,beat:0,timer:null,cls:null};
function mf(n){return 440*Math.pow(2,(n-69)/12);}
function musicVoice(f,t,d,wave,vol,att){const c=SND.ctx,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();o.type=wave;o.frequency.setValueAtTime(f,t);fl.type='lowpass';fl.frequency.value=wave==='sine'?3000:1100;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||.4));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+d+.05);}
function musicKick(t,vol){const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+.3);}
function musicTick(){
 if(!SND.ctx||!MUS.cls) return;
 const sc=MSCORE[MUS.cls]||MSCORE.hunter,bd=60/sc.bpm,c=SND.ctx;
 const battle=S&&S.phase==='battle';
 while(MUS.next<c.currentTime+.35){
  const t=Math.max(MUS.next,c.currentTime+.02),b=MUS.beat,bar=Math.floor(b/4)%sc.prog.length,root=sc.root+sc.prog[bar];
  if(b%4===0){[0,sc.scale[2]||4,7].forEach(function(iv){musicVoice(mf(root+iv),t,bd*4.2,sc.wave==='sawtooth'?'triangle':sc.wave,.022,.6);});musicVoice(mf(root-12),t,bd*4,'sine',.03,.2);}
  const deg=sc.scale[(b*3+bar)%sc.scale.length];
  if(b%2===0||battle) musicVoice(mf(root+12+deg),t,bd*(battle?.7:1.6),'sine',battle?.02:.014,.03);
  if(battle){musicKick(t,b%2===0?.16:.08);}
  MUS.beat++;MUS.next=t+bd;
 }

const RANKS=[['E',0],['D',100],['C',250],['B',450],['A',700],['S',1000]];
function profile(){
 let pr=null;try{pr=JSON.parse(lsGet('nimgir-profile')||'null');}catch(e){}

function rankOf(rp){let i=0;for(let k=0;k<RANKS.length;k++) if(rp>=RANKS[k][1]) i=k;const next=RANKS[i+1];return {i:i,letter:RANKS[i][0],floor:RANKS[i][1],next:next?next[1]:null,pct:next?Math.round((rp-RANKS[i][1])/(next[1]-RANKS[i][1])*100):100};}
function rankBadge(letter,size){return '<span class="rkb rk-'+letter+(size?' '+size:'')+'" title="'+letter+'-Rank">'+letter+'</span>';}
function standardRules(r){return Object.keys(RULE_DEFAULTS).every(function(k){return r[k]===RULE_DEFAULTS[k];});}

 LASTREC=null;

 if(S.mode==='local'||S.puzzle||S.tutorial||S.tutDone) return;
 const me=VIEW(),op=OTHER(),w=S.over.draw?null:S.players[S.over.winner];

 let delta=0,why='';
 const ranked=standardRules(S.rules);
 if(!ranked) why='Custom rules: not ranked';
 else if(S.mode==='online'){delta=res==='win'?30:res==='loss'?-15:0;}

 const bc=pr.byCls[me.cls]||{w:0,l:0};if(res==='win') bc.w++;else if(res==='loss') bc.l++;pr.byCls[me.cls]=bc;

 if(cls==='oathbound') return ['Squire','Knight','Paladin'][lv-1]||String(lv);
 let d='';for(let i=1;i<=max;i++) d+=(i<=lv?'●':'○');return d;
}
function fx(uid,type,text){if(!S) return;(S.fx=S.fx||[]).push({uid:uid,type:type,text:text||''});}
function ghost(owner,lane,s){if(!S) return;(S.ghosts=S.ghosts||[]).push({pi:S.players.indexOf(owner),lane:lane,name:D(s.card).name,cls:D(s.card).cls});}

/* ---------- the Oathbound: Oath, Vow, the Last Oath ---------- */
let EVT=0;
function auraOn(p,eff){return p.back.some(function(sl){return sl&&sl.faceUp&&D(sl.card).effect===eff;});}
function lastOath(p){return p.cls==='oathbound'&&p.hearts.length>0&&p.hearts.length<=2;}
function gainOath(p,why,stamp){
 if(!p||p.cls!=='oathbound'||!S||S.over) return;
 if(stamp&&p.oathStamp===stamp) return;
 if(stamp) p.oathStamp=stamp;
 if((p.oath||0)>=3) return;
 p.oath=(p.oath||0)+1;S.oathFx=S.players.indexOf(p);
 log(p.name+' gains 1 Oath ('+why+'). '+p.oath+' of 3.');
}
function aegisBlocks(pl,lane){return pl.lanes.some(function(x,i){return x&&i!==lane&&has(x,'aegis');});}
function reduceDmg(owner,s,amt,kind){
 let r=amt;
 if(has(s,'bulwark')) r-=300;
 if(kind!=='battle'&&auraOn(owner,'auraAegis')) r-=300;
 return Math.max(0,r);
}
function lastOathSave(owner,s){
 if(!lastOath(owner)||owner.lastOathTurn===S.turnNo) return false;
 owner.lastOathTurn=S.turnNo;s.dmg=hpMax(s)-100;fx(s.uid,'heal','Last Oath');
 log('The Last Oath: '+D(s.card).name+' refuses to fall and holds on at 100 HP.');
 return true;
}
async function oathOffer(p,d){
 if(!d.oath||(p.oath||0)<d.oath) return false;
 const yes=await choose(p,'Spend Oath?',detailHtml(d,'<p>You have <b>'+p.oath+' Oath</b>. Spend '+d.oath+' to empower <b>'+d.name+'</b>?</p>'),[{label:'Spend '+d.oath+' Oath',value:true},{label:'Not this time',value:false,cancel:true}],function(){return true;},true);
 if(yes){p.oath-=d.oath;log(p.name+' spends '+d.oath+' Oath on '+d.name+'.');}
 return !!yes;
}
async function vowOffer(p,d,aiYes){
 const yes=await choose(p,'Take the Vow?',detailHtml(d,'<p>'+d.vowText+'</p>'),[{label:'Take the Vow',value:true},{label:'No Vow',value:false,cancel:true}],function(){return !!aiYes;},true);
 if(yes) log(p.name+' takes the Vow of '+d.name+'.');
 return !!yes;
}

/* ---------- unit helpers ---------- */
function maxLv(s){return D(s.card).levels.length;}
function has(s,a){const ab=D(s.card).abil||{};return Object.keys(ab).some(function(lv){return s.level>=+lv&&ab[lv].indexOf(a)>=0;});}
function hasKw(s,k){return (D(s.card).kw||[]).indexOf(k)>=0;}
function hpMax(s){return D(s.card).levels[s.level-1][1];}
function hpNow(s){return hpMax(s)-s.dmg;}
function dialTotal(p){return p.dial.R+p.dial.A+p.dial.S;}
function atkOf(p,s,vs){
 let a=D(s.card).levels[s.level-1][0]+s.boost+(s.perm||0);
 if(hasKw(s,'hoard')) a+=Math.min(S.rules.hoardCap||300,100*dialTotal(p));
 if(vs&&has(s,'vsHigher300')&&vs.level>s.level) a+=300;
 p.lanes.forEach(function(o){if(o&&o!==s&&has(o,'allyBoost')) a+=300;});
 if(p.back.some(function(sl){return sl&&sl.faceUp&&D(sl.card).effect==='auraAtk300';})) a+=300;
 if(has(s,'oathStrike')) a+=200*(p.oath||0);
 if(p.cls==='oathbound'){if(lastOath(p)) a+=500;if(s.level===maxLv(s)&&auraOn(p,'auraHall')) a+=500;}
 return a;
}
function gainHeart(p,why){
 if(p.hearts.length>=S.rules.hearts||!p.deck.length) return;
 p.hearts.push(p.deck.shift());log(p.name+' gains a heart ('+why+'). '+p.hearts.length+' now.');
}
function raiseLevel(s,why){
 const hurt=s.dmg>0;s.level++;s.dmg=0;stInc(ownerOf(s),'levels');fx(s.uid,'level',lvBadge(s));
 log((why?why+': ':'')+D(s.card).name+' levels up to '+lvName(s)+(hurt?' and is fully healed':'')+'.');
 if(has(s,'onLevelDraw')){const o=ownerOf(s);if(o) draw(o,1);}
}
function lvName(s){return ladder(D(s.card).cls,s.level,maxLv(s));}
function ownerOf(s){return S.players.find(function(p){return p.lanes.indexOf(s)>=0;});}

/* ---------- resources ---------- */
function shortage(p,cost){return ['R','A','S'].reduce(function(t,k){return t+Math.max(0,(cost[k]||0)-p.dial[k]);},0);}
function canPay(p,d){const sh=shortage(p,d.cost);if(sh===0)return true;return !!d.pact&&Math.ceil(sh/pactRate())<p.hearts.length;}
function pay(p,d){
 let sh=0;
 ['R','A','S'].forEach(function(k){const need=d.cost[k]||0;const use=Math.min(need,p.dial[k]);p.dial[k]-=use;sh+=need-use;});
 if(sh>0) loseHearts(p,Math.ceil(sh/pactRate()),'Pact paid for '+sh+' crest'+(sh>1?'s':''));
}
function costHtml(cost,pact){let h='';['R','A','S'].forEach(function(k){for(let i=0;i<(cost[k]||0);i++)h+=icon(k,16);});if(pact)h+='<span class="c-H" title="Pact">'+heartIcon(14)+'</span>';return h;}
function costText(cost){return ['R','A','S'].filter(function(k){return cost[k];}).map(function(k){return cost[k]+' '+CREST[k];}).join(' + ');}
function addCrest(p,k,n,why){
 const before=p.dial[k];p.dial[k]=Math.min(dialCap(),before+n);const lost=before+n-p.dial[k];
 log(p.name+' adds '+n+' '+CREST[k]+(why?' ('+why+')':'')+'.'+(lost?' '+lost+' lost to the cap of '+dialCap()+'.':''));
}
function checkWin(){
 if(S.over) return true;
 const z=S.players.map(function(p){return p.hearts.length===0;});
 if(z[0]&&z[1]) S.over={draw:true};
 else if(z[0]) S.over={winner:1};
 else if(z[1]) S.over={winner:0};
 if(S.over) log(S.over.draw?'Both players are out of hearts. The game is a draw.':S.players[S.over.winner].name+' wins!');
 return !!S.over;
}
function loseHearts(p,n,why){
 n=Math.min(n,p.hearts.length);
 if(S){S.heartFx=S.heartFx||{};const pi=S.players.indexOf(p);S.heartFx[pi]=(S.heartFx[pi]||0)+n;}
 for(let i=0;i<n;i++) p.death.push(p.hearts.pop());
 stInc(p,'heartsLost',n);
 log(p.name+' loses '+n+' heart'+(n>1?'s':'')+' ('+why+'). '+p.hearts.length+' left.');
 checkWin();
 if(!S.over&&lastOath(p)&&!p.lastOathShown){p.lastOathShown=true;log('Awakening: The Last Oath! '+p.name+'’s Summons get +500 ATK.');splash('The Last Oath','Awakening: +500 ATK, and one enemy effect each turn can’t destroy your Summons','oathbound');}
}
function draw(p,n){
 for(let i=0;i<n;i++){
  if(S.over) return;
  if(!p.deck.length){loseHearts(p,1,'empty deck');continue;}
  p.hand.push(p.deck.shift());
 }
}

/* ---------- counters ---------- */
async function tryCounter(owner,triggers,text){
 if(S.over||owner===P()||owner.counterUsedTurn===S.turnNo) return null;
 for(let i=0;i<3;i++){
  const sl=owner.back[i];
  if(!sl||sl.faceUp) continue;
  const d=D(sl.card);
  if(d.type!=='counter'||triggers.indexOf(d.trigger)<0||sl.setTurn>=S.turnNo) continue;
  const who=S.mode==='ai'?'Your Counter can trigger!':owner.name+', this is your call';
  const yes=await choose(owner,'Activate '+d.name+'?',detailHtml(d,'<p><b>What happened:</b> '+text+'</p><p>Spring this Counter now? It flips face-up and its effect happens straight away. You can only activate one Counter per turn.</p>'),
   [{label:'Activate '+d.name,value:true},{label:'Keep it hidden',value:false,cancel:true}],function(){return d.effect!=='paySurvive'||owner.hearts.length>2;},true,who);
  if(yes){
   owner.counterUsedTurn=S.turnNo;stInc(owner,'counters');
   log(owner.name+' activates '+d.name+'.');
   splash('Counter!',d.name,d.cls);
   gainOath(owner,'sprang '+d.name,S.evt);
   if(d.sub==='aura') sl.faceUp=true; else {owner.back[i]=null;owner.death.push(sl.card);}
   return {def:d,slot:sl};
  }
 }
 return null;
}
/* ---------- destroy / damage ---------- */
function destroyNow(owner,lane){
 const s=owner.lanes[lane];owner.lanes[lane]=null;owner.death.push(s.card);ghost(owner,lane,s);if(!(owner===P()&&!S.killer)) stInc(otherOf(owner),'kills');
 log(D(s.card).name+' ('+owner.name+') is destroyed.');
 if(has(s,'onDeathRise')) addCrest(owner,'R',1,D(s.card).name);
 if(has(s,'deathDraw')) draw(owner,1);
 if(has(s,'deathDmg')){const en=S.players[1-S.players.indexOf(owner)];const ls=[0,1,2].filter(function(i){return en.lanes[i];}).sort(function(a,b){return hpNow(en.lanes[a])-hpNow(en.lanes[b]);});
  if(ls.length){const t=en.lanes[ls[0]];t.dmg+=500;fx(t.uid,'hit','-500');log(D(s.card).name+' explodes: '+D(t.card).name+' takes 500 damage.');if(hpNow(t)<=0) destroyNow(en,ls[0]);}}
 owner.lanes.forEach(function(o){if(o&&has(o,'feast')){o.perm=(o.perm||0)+300;log(D(o.card).name+' feasts: +300 ATK.');}});
 if(owner.back.some(function(sl){return sl&&sl.faceUp&&D(sl.card).effect==='auraAltar';})) addCrest(owner,'R',1,'Altar of Blood');
 if(auraOn(owner,'auraMartyr')) gainOath(owner,'Martyr’s Oath');
}
async function destroyCheck(owner,lane){
 const s=owner.lanes[lane];
 if(!s||hpNow(s)>0) return false;
 const c=await tryCounter(owner,['ownWouldDestroy'],D(s.card).name+' is about to be destroyed.');
 if(c){
  if(c.def.effect==='paySurvive'){loseHearts(owner,1,c.def.name);s.dmg=0;fx(s.uid,'heal','Saved');log(D(s.card).name+' survives and is fully healed.');return false;}
  if(c.def.effect==='surviveHeal'){s.dmg=0;fx(s.uid,'heal','Saved');log(D(s.card).name+' survives and is fully healed.');return false;}
  if(s.level<maxLv(s)) raiseLevel(s,'Last Stand');
  else {s.dmg=hpMax(s)-100;log(D(s.card).name+' survives with 100 HP.');}
  return false;
 }
 destroyNow(owner,lane);
 const c2=await tryCounter(owner,['ownDestroyed'],D(s.card).name+' was destroyed.');
 if(c2&&c2.def.effect==='bargain') await chooseCrests(owner,2,'Dark Bargain');
 if(c2&&c2.def.effect==='draw2') draw(owner,2);
 if(c2&&c2.def.effect==='vengeance1000'){
  const k=S.killer;
  if(k&&k.owner.lanes.indexOf(k.s)>=0) await damageSummon(k.owner,k.owner.lanes.indexOf(k.s),1000,'counter');
  else log(c2.def.name+' finds no target.');
 }
 return true;
}
async function damageSummon(owner,lane,amt,kind){
 const s=owner.lanes[lane];if(!s) return false;
 const opposing=kind==='counter'?owner===P():owner!==P();
 if(opposing) amt=reduceDmg(owner,s,amt,kind);
 s.dmg+=amt;if(opposing) stInc(otherOf(owner),'dmg',amt);fx(s.uid,'hit','-'+amt);
 log(D(s.card).name+' takes '+amt+' damage ('+Math.max(0,hpNow(s))+' HP left).');
 if(hpNow(s)<=0&&kind==='skill'&&has(s,'skillProof')){
  s.dmg=hpMax(s)-100;
  log(D(s.card).name+" can't be destroyed by Skills and holds on at 100 HP.");
  if(opposing) gainOath(owner,D(s.card).name+' endured',S.evt);
  return false;
 }
 if(hpNow(s)<=0&&opposing&&lastOathSave(owner,s)){gainOath(owner,D(s.card).name+' endured',S.evt);return false;}
 const gone=await destroyCheck(owner,lane);
 if(!gone&&opposing&&owner.lanes[lane]===s) gainOath(owner,D(s.card).name+' endured',S.evt);
 return gone;
}

/* ---------- turn flow ---------- */
function newGame(){
 uidc=0;
 const rules=Object.assign({},setup.rules),ai=setup.mode==='ai';
 const a=makePlayer(ai?'Player':'Player 1',setup.p[0].cls,rules), b=makePlayer(ai?'Opponent':'Player 2',setup.p[1].cls,rules);
 if(ai){b.ai=true;b.aiLevel=rules.aiLevel;a.rank=rankOf(profile().rp).letter;}
 const first=Math.random()<0.5?0:1;
 S={mode:ai?'ai':'local',players:[a,b],active:first,turnNo:1,phase:'handoff',log:[],over:null,modal:null,busy:false,pick:null,rules:rules};
 log(S.players[first].name+' goes first (no draw, 2 dice, no attacks on turn 1).');
 run(startTurn);
}
async function beginTurn(){
 const p=P();
 S.phase='handoff';
 S.pick=null;S.usel=null;
 if(S.mode==='local'&&S.rules.pass) await ask('Turn '+S.turnNo,'<p>Pass the device to <b>'+p.name+'</b> ('+CLASSES[p.cls].name+').</p>',[{label:'Start '+p.name+"'s turn",value:1}]);
 p.lanes.forEach(function(s){if(s) s.attacked=false;});
 log('Turn '+S.turnNo+': '+p.name+'.');
 splash(S.mode==='ai'?(p.ai?'Opponent’s turn':'Your turn'):p.name+'’s turn','Turn '+S.turnNo,p.cls);
 if(S.turnNo>1){
  if(!p.ai){S.phase='draw';if(S.rules.tapDraw&&p.deck.length){await new Promise(function(r){drawResolve=r;render();});}}
  const before=p.hand.length;draw(p,S.rules.draw);
  S.drawFx=p.hand.slice(before).map(function(c){return c.uid;});S.deckFx=S.players.indexOf(p);
  render();if(!p.ai) await sleep(Math.min(650,AI_DELAY));
 }
 if(S.over) return;
 for(let i=0;i<3;i++){
  const sl=p.back[i];if(!sl||!sl.faceUp) continue;
  const d=D(sl.card);
  if(d.effect==='auraCrest') await chooseCrests(p,1,'Ember Hoard');
  if(d.effect==='bind'){
   const ch=await choose(p,'Binding Sigil upkeep',detailHtml(d,'<p>Keep Binding Sigil by losing 1 heart, or let it break.</p>'),[{label:'Lose 1 heart and keep it',value:'heart',disabled:p.hearts.length<=1},{label:'Let Binding Sigil break',value:'destroy'}],function(){return p.hearts.length>2?'heart':'destroy';},true);
   if(ch==='heart') loseHearts(p,1,'Binding Sigil');
   else {p.back[i]=null;p.death.push(sl.card);log(p.name+' lets Binding Sigil break.');}
  }
  if(S.over) return;
 }
 p.lanes.forEach(function(s){if(s&&has(s,'startArcane')) addCrest(p,'A',1,D(s.card).name);});
 p.lanes.forEach(function(s){if(s&&has(s,'regen')&&s.dmg>0){s.dmg=0;fx(s.uid,'heal','Healed');log(D(s.card).name+' regenerates to full HP.');}});
 for(let i=0;i<3&&!S.over;i++){const s=p.lanes[i];if(s&&has(s,'startDmg300')){const t=await pickEnemy(p,D(s.card).name);if(t!==null){log(D(s.card).name+' calls down lightning.');await damageSummon(O(),t,300,'ability');}}}
 p.back.forEach(function(sl){if(sl&&sl.faceUp&&D(sl.card).effect==='auraArcane') addCrest(p,'A',1,'Ley Line');});
 if(auraOn(p,'auraHeal400')&&p.lanes.some(function(x){return x&&x.dmg>0;})){p.lanes.forEach(function(x){if(x&&x.dmg>0){x.dmg=Math.max(0,x.dmg-400);fx(x.uid,'heal','+400');}});log('Sanctuary heals '+p.name+'’s Summons by 400.');}
 if(auraOn(p,'auraChapel')&&(p.oath||0)>0) addCrest(p,'R',1,'Chapel of Vows');
 for(let i=0;i<3;i++){const s=p.lanes[i];if(s&&has(s,'startCrest')) await chooseCrests(p,1,D(s.card).name);}
 if(p.lanes.some(function(s){return s&&has(s,'startHealAll');})){p.lanes.forEach(function(s){if(s&&s.dmg>0){s.dmg=Math.max(0,s.dmg-500);}});log(p.name+"'s healer restores 500 HP to each Summon.");}
 p.dice=Array.from({length:Math.max(1,(S.rules.dice||3)-(S.turnNo===1?1:0))},rollFace);p.wild={};S.rollFx=true;p.rerolled=false;p.sel=[];
 S.phase='roll';
}
function rollFace(){if(S&&S.tutorial&&S.tutorial.q&&S.tutorial.q.length) return S.tutorial.q.shift();return ['R','R','A','A','S','W'][Math.floor(Math.random()*6)];}
async function confirmDice(){
 const p=P(),gain={R:0,A:0,S:0};
 p.dice.forEach(function(f,i){let k=f;if(k==='W') k=(p.wild&&p.wild[i])||aiCrest(p);gain[k]++;});
 S.dialFx={pi:S.players.indexOf(p),g:{}};
 ['R','A','S'].forEach(function(k){if(gain[k]){addCrest(p,k,gain[k],'rolled');S.dialFx.g[k]=gain[k];}});
 p.dice=[];p.wild={};p.sel=[];S.phase='main';
}
async function endTurn(){
 const p=P();
 if(S.puzzle){if(S.puzzle.goal==='clear'&&boardEmpty(S.players[1])) puzzleResult(true); else puzzleResult(false);return;}
 const lim=S.rules.handLimit===undefined?7:S.rules.handLimit;
 while(lim&&p.hand.length>lim){
  const uid=await choose(p,'Discard down to '+lim,'<p>You have '+p.hand.length+' cards and can keep '+lim+'. Choose a card to discard.</p>',p.hand.map(function(c){return {label:'Discard',value:c.uid,card:D(c)};}),lowestVal,true);
  const i=p.hand.findIndex(function(c){return c.uid===uid;});p.death.push(p.hand.splice(i,1)[0]);
 }
 for(let i=0;i<3;i++){const x=p.lanes[i];if(x&&x.doomTurn===S.turnNo){log('The Vow is kept: '+D(x.card).name+' falls at the end of the turn.');destroyNow(p,i);}}
 S.players.forEach(function(pl){pl.lanes.forEach(function(s){if(s){s.boost=0;}});});
 S.turnNo++;S.active=1-S.active;
 await startTurn();
}

/* ---------- actions ---------- */
function emptyLanes(p){return [0,1,2].filter(function(i){return !p.lanes[i];});}
function emptySlots(p){return [0,1,2].filter(function(i){return !p.back[i];});}
async function bloodPrice(p,s){
 const others=[0,1,2].filter(function(i){return p.lanes[i]&&p.lanes[i]!==s;});
 const opts=[{label:'Lose 1 heart',value:'heart'}];
 if(p.hand.length>=2) opts.push({label:'Discard 2 cards from your hand',value:'discard'});
 others.forEach(function(i){opts.push({label:'Destroy it',value:i,card:D(p.lanes[i].card),level:p.lanes[i].level});});
 if(opts.length===1){loseHearts(p,1,'blood price for '+D(s.card).name);return;}
 const ch=await choose(p,'Blood price',detailHtml(D(s.card),'<p><b>'+D(s.card).name+'</b> demands a price. Lose a heart, discard 2 cards, or destroy one of your other Summons.</p>'),opts,function(){
  if(p.hand.length>=3) return 'discard';if(p.hearts.length>3) return 'heart';
  const w=others.slice().sort(function(a,b){return atkOf(p,p.lanes[a],null)-atkOf(p,p.lanes[b],null);})[0];
  return w!==undefined?w:(p.hand.length>=2?'discard':'heart');},true);
 if(ch==='heart') loseHearts(p,1,'blood price');
 else if(ch==='discard'){
  for(let k=0;k<2;k++){const uid=await choose(p,'Blood price','<p>Choose a card to discard ('+(k+1)+' of 2).</p>',p.hand.map(function(c){return {label:'Discard',value:c.uid,card:D(c)};}),lowestVal,true);const i=p.hand.findIndex(function(c){return c.uid===uid;});if(i>=0) p.death.push(p.hand.splice(i,1)[0]);}
  log(p.name+' discards 2 cards as a blood price.');
 }
 else destroyNow(p,ch);
}
async function pickEnemy(p,why){
 const o=O(),idx=[0,1,2].filter(function(i){return o.lanes[i];});
 if(!idx.length) return null;
 if(idx.length===1) return idx[0];

  if(eff==='bounceAttacker'){p.lanes[lane]=null;p.hand.push(s.card);log(sn+' is blown back to '+p.name+'’s hand.');return;}
  if(eff==='zap1500'){log('The hit is cancelled.');await damageSummon(p,lane,1500,'counter');return;}
  await animAttack(s,null,S.players.indexOf(o));
  const a=atkOf(p,s,null);let n=a<=0?0:(S.rules.heartPer?Math.max(1,Math.floor(a/S.rules.heartPer)):1);if(n>0&&has(s,'directPlus1')) n++;

  loseHearts(o,n,'direct hit');
 }
 } finally {

    const t=ts[Math.floor(Math.random()*ts.length)];

    await attack(i,t);render();await sleep(AI_DELAY);continue;
   }
   let best=null,score=-1e9;
   attackTargets(o).forEach(function(t){const d2=o.lanes[t],a=atkOf(p,s,d2),kills=a>=hpNow(d2),back=kills?0:atkOf(o,d2,s),dies=back>=hpNow(s);

   if(best===null) continue;

 for(const i of order){if(S.over) return;const s=p.lanes[i];if(L===0||(L===1&&Math.random()<.5)) continue;if(s&&!levelBlock(s)){levelUp(i);await aiStep('Levelling up '+D(s.card).name);}}

async function aiBattleSmart(p,o){
 const L=aiLv(p);
 for(let guard=0;guard<6&&!S.over;guard++){
  let best=null;
  for(let i=0;i<3;i++){
   const s=p.lanes[i];if(!s||attackBlock(s)) continue;
   if(boardEmpty(o)){const sc=1500+atkOf(p,s,null)/1000;if(!best||sc>best.sc) best={i:i,t:null,sc:sc,emp:false};continue;}
   attackTargets(o).forEach(function(t){
    let sc=aiAttackScore(p,o,s,t),emp=false;
    const d2=o.lanes[t],a=atkOf(p,s,d2);
    if(p.dial.S>=1&&a<hpNow(d2)&&a+500>=hpNow(d2)){sc=1000+atkOf(o,d2,null)-(L>=4?150:0);emp=true;}

    if(sc>=1000) sc-=atkOf(p,s,null)/50;
    if(!best||sc>best.sc) best={i:i,t:t,sc:sc,emp:emp};
   });

  if(!best||best.sc<=-200) break;
  const s=p.lanes[best.i];
  if(best.emp) empower(best.i);
  if(best.t===null){await aiStep(D(s.card).name+' attacks you directly!',AI_DELAY*.6);await attack(best.i,null);}
  else {await aiStep(D(s.card).name+' attacks '+D(o.lanes[best.t].card).name,AI_DELAY*.6);await attack(best.i,best.t);}
  render();await sleep(AI_DELAY);
 }
}

 const side=function(k,n){return '<div class="vsside" style="--c:'+colorVar(k)+'"><span class="vsem">'+emblem(k,96)+'</span><b class="display">'+n+'</b><span>'+CLASSES[k].name+'</span></div>';};
 return '<div class="vs" data-act="skipvs"><div class="vsrow">'+side(a,ai?'You':'Player 1')+'<span class="vsword display">VS</span>'+side(b,ai?'Opponent':'Player 2')+'</div>'+
  '<div class="loadbar" aria-hidden="true"><i></i></div><p class="loadtext" aria-live="polite">Shuffling decks, laying out hearts…</p>'+
  '<p class="tip"><b>Tip:</b> '+(setup.tip||TIPS[0])+'</p><p class="muted small">Tap to skip</p></div>';
}
function setupScreenHtml(){
 const sc=setup.screen||'title';
 if(sc==='mode') return modeHtml();
 if(sc==='select') return selectHtml();
 if(sc==='howto') return howtoHtml();
 if(sc==='cards') return cardsHtml();
 if(sc==='settings') return settingsHtml();
 if(sc==='vs') return vsHtml();
 if(sc==='online') return onlineHtml();
 if(sc==='profile') return profileHtml();
 if(sc==='puzzles') return puzzlesHtml();
 return titleHtml();
}
let vsTimer=null;
function startVs(){
 setup.screen='vs';setup.tip=TIPS[Math.floor(Math.random()*TIPS.length)];render();
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 clearTimeout(vsTimer);vsTimer=setTimeout(finishVs,reduce?500:2400);
}
function finishVs(){clearTimeout(vsTimer);if(setup.screen!=='vs') return;setup.screen='title';newGame();}
function render(){
 const app=document.getElementById('app');
 if(!S){try{musicSync();}catch(e){}const scr=setup.screen+(setup.view||'');app.innerHTML=setupScreenHtml()+(LM?modalHtml(LM,'lmodal'):'');if(scr!==LASTSCR&&animOK()&&app.firstElementChild&&app.firstElementChild.animate) app.firstElementChild.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});LASTSCR=scr;return;}
 const enterGame=LASTSCR!=='game';LASTSCR='game';
 try{if(S.tutorial) tutTick();}catch(e){console.error(e);}
 const me=VIEW(),op=OTHER(),act=P();
 const hidePick=S.mode==='online'&&me!==act,svPick=S.pick,svUsel=S.usel;if(hidePick){S.pick=null;S.usel=null;}
 const title=S.puzzle?'Puzzle · '+PUZZLES[S.puzzle.i].title+' · '+(S.puzzle.goal==='clear'?'Destroy every enemy Summon':'Win this turn'):S.mode==='ai'?(act.ai?'Opponent’s turn':'Your turn'):S.mode==='online'?(act===me?'Your turn':act.name+'’s turn'):act.name+'’s turn';
 const phaseName={handoff:'',draw:'Draw',roll:'Roll',main:'Play phase',battle:'Battle phase'}[S.phase]||'';
 const pop=setup.optsOpen?'<div class="optpop" role="menu"><button class="ghost" data-act="optconfirm" aria-pressed="'+!!setup.rules.confirm+'">“Are you sure?” pop-ups: <b>'+(setup.rules.confirm?'On':'Off')+'</b></button><button class="ghost" data-act="optsound" aria-pressed="'+!!setup.rules.sound+'">Sound: <b>'+(setup.rules.sound?'On':'Off')+'</b></button><button class="ghost" data-act="optmusic" aria-pressed="'+!!setup.rules.music+'">Music: <b>'+(setup.rules.music?'On':'Off')+'</b></button>'+(S.puzzle?'<button class="ghost" data-act="pzrestart">Restart puzzle</button>':'')+'<button class="ghost" data-act="togglelog">Show / hide game log</button><button class="ghost" data-act="quit">Quit to title</button></div>':'';
 const hidden=S.phase==='handoff'&&S.mode==='local';
 let handNote='';
 if(!hidden&&!S.over){if(act.ai||act.remote) handNote='<div class="handlock soft">Opponent’s turn</div>';else if(S.phase==='battle') handNote='<div class="handlock">Battle phase: cards are locked until your next turn</div>';}
 const lostCls=S.over&&!S.over.draw&&(S.mode==='ai'||S.mode==='online')&&S.players[S.over.winner]!==VIEW()?' lost':'';
 app.innerHTML='<div class="gamewrap'+lostCls+'"><div class="top"><h1 class="display">Turn '+S.turnNo+' · '+title+'</h1><span class="phase">'+phaseName+'</span><div class="optwrap"><button class="ghost" data-act="optsmenu" aria-expanded="'+!!setup.optsOpen+'">Options</button>'+pop+'</div></div>'+
  '<div class="game2'+(setup.logHide?' logclosed':'')+(setup.logShow?' logopen':'')+'"><div class="board2 th-'+me.cls+'" style="--opc:'+colorVar(op.cls)+';--mec:'+colorVar(me.cls)+'"><div class="wm wm-op" style="--c:'+colorVar(op.cls)+'" aria-hidden="true">'+emblem(op.cls,200)+'</div><div class="wm wm-me" style="--c:'+colorVar(me.cls)+'" aria-hidden="true">'+emblem(me.cls,200)+'</div>'+
   stripHtml(op,'op')+backHtml(op,'op')+lanesHtml(op,'op')+
   centreHtml()+
   lanesHtml(me,'me')+backHtml(me,'me')+stripHtml(me,'me')+
   '<div class="handrow">'+(hidden?'<p class="rowlabel">Hand hidden until the turn starts.</p>':handHtml(me)+handNote)+'</div>'+
  '</div><aside class="log" aria-label="Game log"><button class="ghost logclose" data-act="togglelog">Close</button><h2 class="display">Game log</h2><ol>'+S.log.map(function(e){const ap=S.players[e.a];return '<li'+(ap?' style="--c:'+colorVar(ap.cls)+'" class="by'+(ap===me?' mine':'')+'"':'')+'><span>T'+e.t+'</span>'+logRich(e.m)+'</li>';}).join('')+'</ol></aside></div></div>'+(LM?modalHtml(LM,'lmodal'):(S.modal&&(S.mode!=='online'||S.modal.pi===S.mySeat)?modalHtml(S.modal,'modal'):''))+netToastHtml()+(S.tutorial?coachHtml():'')+splashHtml();
 if(hidePick){S.pick=svPick;S.usel=svUsel;}
 const first=document.querySelector('.modal .opts button:not([disabled]):not(.cancel), .modal .choice:not([disabled]), .modal .opts button:not([disabled])');if(first) first.focus();
 if(enterGame&&animOK()){const g=document.querySelector('.gamewrap');if(g&&g.animate) g.animate([{opacity:0,transform:'scale(.985)'},{opacity:1,transform:'none'}],{duration:420,easing:'ease-out'});}
 try{postFx();}catch(e){}
 try{maybeShowResults();musicSync();puzzleCheck();}catch(e){}
 try{if(S&&S.tutorial) coachHighlight();}catch(e){console.error(e);}
 if(NET.role==='host'&&S.mode==='online') netCapture();
 if(NET.role==='guest'&&NET.anims&&NET.anims.length){const an=NET.anims;NET.anims=[];guestAnims(an);}
 S.fx=[];S.ghosts=[];S.heartFx={};S.rollFx=false;S.rollIdx=null;S.dialFx=null;S.drawFx=null;S.deckFx=null;S.oathFx=null;
}
/* ---------- events ---------- */
document.addEventListener('click',function(e){
 if(setup.rules.sound) actx();
 const b=e.target.closest('[data-act]');if(!b||b.disabled) return;
 if(b.matches('.ghost,.seg button,.poster,.clsbtn')) sfx('click');
 const a=b.dataset.act;
 if(a==='results'){if(S&&S.over&&!LM){LM={title:'Match stats',body:resultsHtml(),options:[{label:'Close',value:null,cancel:true}],wide:true};LMres=null;render();}return;}
 if(a==='logcard'){if(LM||!DEFS[b.dataset.id]) return;infoRun(function(){return showDetails(DEFS[b.dataset.id]);});return;}
 if(a==='lmodal'){if(!LM) return;const opt=LM.options[+b.dataset.i];const r=LMres;LM=null;LMres=null;render();if(r) r(opt?opt.value:null);return;}
 if(a==='modal'){
  if(!S||!S.modal) return;
  if(S.mode==='online'){if(S.modal.pi!==S.mySeat) return;if(NET.role==='guest'){const ms=S.modal.seq;S.modal=null;render();guestSend('modal',{i:String(b.dataset.i)},ms,true);return;}}
  const opt=S.modal.options[+b.dataset.i];const r=modalResolve;S.modal=null;modalResolve=null;render();if(r) r(opt.value);return;
 }
 if(a==='pick'){setup.p[+b.dataset.p].cls=b.dataset.cls;render();return;}
 if(a==='mode'&&b.dataset.mode==='online'){setup.screen='online';NET.err='';render();ioInit().then(function(){netRefresh();});return;}
 if(a==='pzrestart'){if(S&&S.puzzle&&!S.busy){setup.optsOpen=false;startPuzzle(S.puzzle.i);}return;}
 if(a==='puzzle'){startPuzzle(+b.dataset.i);return;}
 if(a==='tutorial'){startTutorial();return;}
 if(a==='nethost'){hostCreate();return;}
 if(a==='netshare'){netShare();return;}
 if(a==='netjoin'){guestJoin(NET.typed);return;}
 if(a==='netjoinc'){guestJoin(b.dataset.code);return;}
 if(a==='netcancel'){netLeave();setup.screen='online';netRefresh();render();return;}
 if(a==='netrefresh'){netRefresh();return;}
 if(a==='mode'){setup.mode=b.dataset.mode;setup.screen='select';render();try{window.scrollTo(0,0);}catch(e){}return;}
 if(a==='rule'){const r=RULEOPTS.concat(GAMEOPTS,AIOPTS,TESTOPTS).find(function(x){return x.k===b.dataset.k;});setup.rules[r.k]=r.opts[+b.dataset.i][0];if(r.k==='aiSpeed') AI_DELAY=setup.rules.aiSpeed;render();return;}
 if(a==='viewdeck'){setup.view=b.dataset.cls;render();return;}
 if(a==='closedeck'){setup.view=null;render();return;}
 if(a==='optsmenu'){setup.optsOpen=!setup.optsOpen;render();return;}
 if(a==='optmusic'){setup.rules.music=!setup.rules.music;if(setup.rules.music) actx();render();return;}
 if(a==='optsound'){setup.rules.sound=!setup.rules.sound;if(setup.rules.sound) actx();render();return;}
 if(a==='optconfirm'){setup.rules.confirm=!setup.rules.confirm;render();return;}
 if(a==='togglelog'){setup.optsOpen=false;const wide=window.matchMedia&&window.matchMedia('(min-width:1100px)').matches;if(wide) setup.logHide=!setup.logHide; else setup.logShow=!setup.logShow;render();return;}
 if(a==='go'){setup.screen=b.dataset.to;render();try{window.scrollTo(0,0);}catch(e){}return;}
 if(a==='resetrules'){Object.assign(setup.rules,RULE_DEFAULTS);render();return;}
 if(a==='cardtab'){setup.cardsCls=b.dataset.cls;render();return;}
 if(a==='skipvs'){finishVs();return;}
 if(a==='start'){startVs();return;}
 if(!S) return;
 if(a==='tutnext'){if(S.tutorial){const st=tutStep();if(st&&st.next){S.tutorial.step++;render();}}return;}
 if(a==='tutkeep'){if(S.tutorial){S.tutorial=null;S.tutDone=true;S.players[1].aiLevel=1;lsSet('nimgir-tutorial','1');render();}return;}
 if(a==='tutquit'){lsSet('nimgir-tutorial','1');drawResolve=null;S=null;setup.screen='title';render();return;}
 if(S.tutorial&&!tutAllows(a,b)){tutNudge();return;}
 if(S.mode==='online'&&NET.role==='guest'){guestAct(a,b.dataset);return;}
 gameAct(a,b.dataset,false);
});
function gameAct(a,ds,remote){
 if((a==='quit'||a==='newgame')&&S.mode==='online'){if(remote) return;netLeave();setup.optsOpen=false;setup.screen='online';netRefresh();render();return;}
 if(a==='quit'||a==='newgame'){if(S.busy&&!S.over&&!drawResolve) return;setup.optsOpen=false;drawResolve=null;const wasPz=S&&S.puzzle;if(S&&S.tutorial) lsSet('nimgir-tutorial','1');S=null;setup.screen=wasPz?'puzzles':a==='newgame'?'select':'title';render();return;}
 if(a==='drawcard'){if(drawResolve&&!S.modal){const r=drawResolve;drawResolve=null;r();}return;}
 if(S.mode==='online'&&!remote&&(a==='udetail'||a==='slot'||a==='pickdetail'||(a==='death'&&!(canAct()&&ds.side==='me')))){if(LM) return;infoAct(a,ds);return;}
 if(S.busy||S.modal) return;
 if(a==='death'){run(function(){return deathMenu(ds.side);});return;}
 if(a==='ophand'){const o=OTHER();run(function(){return ask(o.name+'’s hand','<p class="muted">Testing option: the opponent’s hand is revealed.</p>'+(o.hand.length?'<div class="minigrid">'+o.hand.map(function(c){return miniCard(D(c));}).join('')+'</div>':'<p>Empty.</p>'),[{label:'Close',value:null,cancel:true}],null,true);});return;}
 if(a==='udetail'){run(function(){return unitDetails(ds.side,+ds.lane);});return;}
 if(a==='slot'){run(function(){return slotDetails(ds.side,+ds.i);});return;}
 if(S.over) return;
 if(P().ai) return;
 if(!remote&&P().remote) return;
 const p=P();
 if(setup.optsOpen){setup.optsOpen=false;}
 if(a==='wild'){p.wild=p.wild||{};p.wild[+ds.i]=ds.k;render();return;}
 if(a==='die'){if(p.rerolled) return;const i=+ds.i;if(p.dice[i]==='W') return;const k=p.sel.indexOf(i);if(k>=0)p.sel.splice(k,1);else p.sel.push(i);render();return;}
 if(a==='reroll'){p.wild=p.wild||{};S.rollIdx=p.sel.slice();p.sel.forEach(function(i){p.dice[i]=rollFace();delete p.wild[i];});log(p.name+' rerolls '+p.sel.length+' '+(p.sel.length>1?'dice':'die')+'.');p.sel=[];p.rerolled=!S.rules.freeReroll;render();return;}
 if(a==='confirm'){run(confirmDice);return;}
 if(a==='battle'){S.pick=null;run(goBattle);return;}
 if(a==='end'){S.pick=null;S.usel=null;run(humanEnd);return;}
 if(a==='attackall'){S.pick=null;run(attackAllHuman);return;}
 if(a==='hand'){S.usel=null;const c=p.hand.find(function(x){return x.uid===+ds.uid;});if(c) run(function(){return handTap(c);});return;}
 if(a==='pickcancel'){S.pick=null;render();return;}
 if(a==='pickdetail'){const c=S.pick.card;run(function(){return showDetails(D(c));});return;}
 if(a==='castnow'){run(function(){return resolvePick({});});return;}
 if(a==='lanepick'){run(function(){return resolvePick({lane:+ds.lane});});return;}
 if(a==='slotpick'){run(function(){return resolvePick({slot:+ds.i});});return;}
 if(a==='tgt'){run(function(){return resolvePick({side:ds.side,lane:+ds.lane});});return;}
 if(a==='atk'){S.usel=null;run(function(){return humanAttack(+ds.lane,null);});return;}
 if(a==='usel'){const l=+ds.lane;S.usel=S.usel===l?null:l;render();return;}
 if(a==='uselx'){S.usel=null;render();return;}
 if(a==='atkpick'){S.usel=null;S.pick={mode:'attack',lane:+ds.lane,card:p.lanes[+ds.lane].card};render();return;}
 if(a==='lvl'){run(function(){return humanLevel(+ds.lane);});return;}
 if(a==='emp'){run(function(){return humanEmpower(+ds.lane);});return;}
 if(a==='rush'){run(function(){return humanRush(+ds.lane);});return;}
}
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&!S&&setup.screen&&setup.screen!=='title'){if(setup.screen==='vs'){finishVs();return;}setup.screen='title';render();return;}
 if(e.key!=='Escape') return;
 if(LM){const i=LM.options.findIndex(function(o){return o.cancel;});const r=LMres;const v=i>=0?LM.options[i].value:null;LM=null;LMres=null;render();if(r) r(v);return;}
 if(!S) return;
 if(S.mode==='online'&&S.modal){if(S.modal.pi!==S.mySeat) return;if(NET.role==='guest'){const i=S.modal.options.findIndex(function(o){return o.cancel;});if(i>=0){const ms=S.modal.seq;S.modal=null;render();guestSend('modal',{i:String(i)},ms,true);}return;}}
 if(S.mode==='online'&&NET.role==='guest'){if(S.pick) guestSend('pickcancel',{},0);return;}
 if(S.modal){const opts=S.modal.options;const i=opts.findIndex(function(o){return o.cancel;});if(i>=0){const r=modalResolve;S.modal=null;modalResolve=null;render();if(r) r(opts[i].value);}return;}
 if(setup.optsOpen){setup.optsOpen=false;render();return;}
 if(S.pick&&!S.busy){S.pick=null;render();}
});
(function(){try{const q=new URLSearchParams(location.search).get('join');if(q){NET.typed=q.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);setup.screen='online';ioInit().then(function(){render();});}}catch(e){}})();
render();
</script>
